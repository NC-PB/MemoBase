name: Release

# Builds MemoBase installers for macOS, Linux and Windows and publishes them
# to a GitHub Release.
#
# How to trigger:
#   - Push a tag that starts with "v" (e.g. v0.1.0). In GitHub Desktop:
#     History tab -> right-click your latest commit -> "Create Tag..." ->
#     name it "v0.1.0" -> then Repository menu -> "Push" (tags are pushed too).
#   - Or run it manually from GitHub.com: Actions tab -> "Release" ->
#     "Run workflow".
#
# The job creates a DRAFT release. Review the attached installers on GitHub,
# then click "Publish release" to make it public.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest' # Apple Silicon (M-series) Macs
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest' # Intel Macs
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-22.04' # Linux (.deb, .rpm, .AppImage)
            args: ''
          - platform: 'windows-latest' # Windows (.msi, .exe)
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: 'MemoBase v__VERSION__'
          releaseBody: 'Download the installer for your operating system from the assets below.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
